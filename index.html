<!DOCTYPE html>
<html>
<head>
    <title>Quiz Brawl Stars</title>
</head>
<body style="background-color: black; color: white; padding: 20px;">
    <h1>Quiz Facili</h1>
    
    <div id="quiz-container">
        <div style="margin-bottom: 20px; border: 1px solid white; padding: 10px;">
            <p>Quale Brawler è il terzo membro del trio di Barryl e Tick?</p>
            <button onclick="checkAnswer(this, true)">Penny</button>
            <button onclick="checkAnswer(this, false)">Sam</button>
            <button onclick="checkAnswer(this, false)">Eve</button>
            <button onclick="checkAnswer(this, false)">Dynamike</button>
        </div>
    </div>

    <script>
    function checkAnswer(button, isCorrect) {
        button.style.backgroundColor = isCorrect ? "green" : "red";
        button.style.color = "white";
        let parent = button.parentElement;
        let buttons = parent.getElementsByTagName("button");
        for (let b of buttons) {
            b.disabled = true;
        }
    }
    </script>
</body>
</html>
